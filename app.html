<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POSTURA Studio｜姿勢分析</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f3a3a" />
  <link rel="icon" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="POSTURA" />

  <link rel="stylesheet" href="app.css?v=20260814-1526" />
</head>
<body>
  <dialog id="auth-dialog" class="auth-dialog">
    <form id="auth-form" method="dialog">
      <h2>パスワードを入力してください</h2>
      <div class="field">
        <label for="auth-password">パスワード</label>
        <input id="auth-password" type="password" autocomplete="current-password" required />
      </div>
      <label class="auth-remember">
        <input id="auth-remember" type="checkbox" checked />
        <span>この端末で記憶する</span>
      </label>
      <p id="auth-error" class="auth-error" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="submit" class="icon-btn icon-btn--primary">入る</button>
      </div>
    </form>
  </dialog>

  <header class="app-header no-print">
    <a class="app-back" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      <span>トップへ戻る</span>
    </a>
    <div class="brand">
      <span class="brand-mark">POSTURA</span>
      <span class="brand-divider"></span>
      <span class="brand-sub">Posture Analysis Studio</span>
    </div>
    <div class="header-actions">
      <button id="reset-btn" class="icon-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1.2 13.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        <span>クリア</span>
      </button>
      <button id="print-btn" class="icon-btn" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        <span>印刷</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <p class="app-disclaimer no-print">※ 本ツールの表示は、カメラ計測にもとづく姿勢の傾向の目安です。医学的な診断ではありません。気になる症状がある場合は医療機関にご相談ください。</p>
    <section class="patient-info no-print">
      <div class="field">
        <label for="patient-name">患者氏名（任意・端末内のみ）</label>
        <input id="patient-name" type="text" autocomplete="off" placeholder="例：山田 太郎" />
      </div>
      <div class="field">
        <label for="patient-date">撮影日</label>
        <input id="patient-date" type="date" />
      </div>
      <div class="field">
        <label for="patient-gender">性別</label>
        <select id="patient-gender">
          <option value="male" selected>男性</option>
          <option value="female">女性</option>
        </select>
      </div>
      <div class="field">
        <label for="patient-weekly-frequency">週何回トレーニング可能か</label>
        <select id="patient-weekly-frequency">
          <option value="1">週1回</option>
          <option value="2" selected>週2回</option>
          <option value="3">週3回</option>
          <option value="4">週4回</option>
          <option value="5">週5回以上</option>
        </select>
      </div>
      <div class="field field--full">
        <label>気になる不調・痛みの部位（任意・複数選択可）</label>
        <div id="pain-areas" class="chip-group"></div>
        <small>患者さんご自身が訴える部位を選ぶと、姿勢計測の結果に上乗せして人体図にハイライトされます。</small>
      </div>
    </section>

    <div class="carousel-dots no-print" id="carousel-dots" aria-hidden="true">
      <span class="dot" data-view="front"></span>
      <span class="dot" data-view="right"></span>
    </div>

    <section class="upload-grid">
      <article class="upload-card" data-view="front">
        <h2>正面</h2>
        <label class="dropzone">
          <input type="file" accept="image/*" data-view="front" />
          <span class="dropzone-hint">タップして写真を選択</span>
        </label>
        <div class="canvas-wrap"><canvas data-view="front"></canvas></div>
        <ul class="capture-notes" data-view="front"></ul>
        <ul class="metric-list" data-view="front"></ul>
      </article>
      <article class="upload-card" data-view="right">
        <h2>右側面</h2>
        <label class="dropzone">
          <input type="file" accept="image/*" data-view="right" />
          <span class="dropzone-hint">タップして写真を選択</span>
        </label>
        <div class="canvas-wrap"><canvas data-view="right"></canvas></div>
        <ul class="capture-notes" data-view="right"></ul>
        <ul class="metric-list" data-view="right"></ul>
      </article>
    </section>

    <section class="summary-section">
      <div class="summary-actions no-print">
        <button id="analyze-btn" class="icon-btn icon-btn--primary" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="20" x2="21" y2="20"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="18" y1="20" x2="18" y2="10"/>
          </svg>
          <span>解析結果</span>
        </button>
        <span id="status-text" class="status-text"></span>
      </div>
      <div id="summary-output" class="summary-output"></div>
    </section>
  </main>

  <!-- 起動できなかったときに原因を画面に出す保険。
       モジュールの読み込み自体が失敗すると main.js の中の catch も動かず、
       これまでは真っ白・無反応で「使えない」以外の情報が残らなかった。 -->
  <script>
    (function () {
      var firstError = null;
      window.addEventListener("error", function (e) {
        if (!firstError) firstError = e.message || String(e.error || "");
      });
      window.addEventListener("unhandledrejection", function (e) {
        if (!firstError) firstError = (e.reason && e.reason.message) || String(e.reason || "");
      });
      window.addEventListener("load", function () {
        setTimeout(function () {
          if (window.__posturaReady) return;
          var el = document.getElementById("status-text");
          if (!el) return;
          el.textContent =
            "起動できませんでした" +
            (firstError ? "（" + firstError + "）" : "") +
            "。ページを再読み込みしても直らない場合はこの文言をお知らせください。";
          el.style.color = "#b3261e";
        }, 8000);
      });
    })();
  </script>

  <script type="module" src="src/main.js?v=20260814-1526"></script>
  <script>
    // PWA: サービスワーカー登録（オフライン起動・モデルキャッシュ）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
